name: 'Upstream Sync'

on:
  schedule:
    - cron: '28 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync-main-with-squash-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Rebuild main from upstream and squash branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
          git fetch upstream main --tags
          git fetch origin ci patch/embeddings-and-rerank patch/remove-promotional-sections patch/extract-client-api-keys patch/downstream-versioning patch/update-management-panel patch/client-api-key-models tmp/patch/api-keys-route
          git reset --hard upstream/main

          if ! git merge --squash origin/ci; then
            mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
            if (( ${#conflicts[@]} != 1 )) || [[ ${conflicts[0]} != README.md ]]; then
              printf '::error::Unexpected ci squash conflicts:'
              printf ' %q' "${conflicts[@]}"
              printf '\n'
              exit 1
            fi
          fi
          git restore --source=origin/ci --staged --worktree -- README.md
          if ! git diff --quiet --diff-filter=U --; then
            echo '::error::Unresolved conflicts remain after replacing README.md'
            exit 1
          fi
          git commit -m "merge ci branch"

          git merge --squash origin/patch/embeddings-and-rerank
          git commit -m "merge patch/embeddings-and-rerank branch"

          git merge --squash origin/patch/remove-promotional-sections
          git commit -m "merge patch/remove-promotional-sections branch"

          # The extract patch re-adds the promotional quick-start route that
          # remove-promotional-sections redirects, so both edits land on the same
          # lines. Resolve with the reviewed combination on tmp/patch/api-keys-route
          # and fail closed if the shape is anything else.
          COMPAT_BASE=$(git rev-parse origin/patch/extract-client-api-keys)
          COMPAT_TIP=$(git rev-parse origin/tmp/patch/api-keys-route)
          if ! git merge --squash origin/patch/extract-client-api-keys; then
            mapfile -t compat_conflicts < <(git diff --name-only --diff-filter=U)
            if (( ${#compat_conflicts[@]} != 1 )) || [[ ${compat_conflicts[0]} != src/router/MainRoutes.tsx ]]; then
              printf '::error::Unexpected extract-client-api-keys conflicts:'
              printf ' %q' "${compat_conflicts[@]}"
              printf '\n'
              exit 1
            fi
            git checkout --theirs -- src/router/MainRoutes.tsx
            if ! git diff "$COMPAT_BASE" "$COMPAT_TIP" -- src/router/MainRoutes.tsx | git apply --index; then
              echo '::error::api-keys-route compatibility patch no longer applies'
              exit 1
            fi
          fi
          git commit -m "merge patch/extract-client-api-keys branch"

          git merge --squash origin/patch/downstream-versioning
          git commit -m "merge patch/downstream-versioning branch"

          git merge --squash origin/patch/update-management-panel
          git commit -m "merge patch/update-management-panel branch"

          git merge --squash origin/patch/client-api-key-models
          git commit -m "merge patch/client-api-key-models branch"

      - name: Validate build and tests
        run: |
          bun install --frozen-lockfile
          bun run type-check
          bun test
          bun run build

      - name: Push rebuilt main
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin HEAD:main
