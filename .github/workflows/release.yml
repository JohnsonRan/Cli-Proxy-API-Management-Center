name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  # Upstream Sync pushes main with GITHUB_TOKEN, which does not trigger push events.
  workflow_run:
    workflows:
      - 'Upstream Sync'
    types:
      - completed

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute downstream version
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git 2>/dev/null || true
          git fetch upstream main --tags
          commit_sha="$(git rev-parse --short=7 HEAD)"
          upstream_base="upstream/main"
          upstream_tag="$(git tag -l "v*" --merged "${upstream_base}" --sort=-v:refname | grep -v "+" | head -n 1 || true)"
          if [ -z "${upstream_tag}" ]; then
            echo "::error::No upstream release tag is reachable from ${upstream_base}"
            exit 1
          fi
          patch_count="$(git rev-list --count "${upstream_base}..HEAD")"
          if [ "${patch_count}" != "0" ]; then
            app_version="${upstream_tag}+${patch_count}-${commit_sha}"
            release_tag="${upstream_tag}-${patch_count}-${commit_sha}"
          else
            app_version="${upstream_tag}-${commit_sha}"
            release_tag="${upstream_tag}-${commit_sha}"
          fi
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - name: Skip an already released commit
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag embeds the commit, so an existing release means this exact main was
          # already published (an unchanged sync, or a push and a sync for one commit).
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all-in-one HTML
        if: steps.existing.outputs.skip != 'true'
        run: bun run build
        env:
          VERSION: ${{ env.APP_VERSION }}

      - name: Prepare release assets
        if: steps.existing.outputs.skip != 'true'
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          current_ref="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_ref}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          : > release-notes.md
          git log -n 20 --pretty=format:"- %h %s" "${range}" >> release-notes.md

      - name: Create Release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_VERSION }}
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
